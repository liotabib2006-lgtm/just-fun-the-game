<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Slope Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            z-index: 20;
        }
        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        button:hover {
            background: #ff007f;
            color: white;
            box-shadow: 0 0 15px #ff007f;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        Score: <span id="score">0</span> | Coins: <span id="coins">0</span>
    </div>

    <div id="instructions">
        <h1>Neon Slope Dash</h1>
        <p>Use <b>Left Arrow / Right Arrow</b> or <b>A / D</b> keys to steer.</p>
        <p>Red Blocks = Obstacles (Avoid)</p>
        <p>Yellow Cylinders = Collectible Coins</p>
        <p>Green Pads = Speed Boost | Blue Pads = Slow Down</p>
        <button onclick="startGame()">Start Game</button>
    </div>
